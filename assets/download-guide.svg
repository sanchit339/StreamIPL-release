<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%" style="background:#0F0F11; border-radius:16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F80ED" />
      <stop offset="100%" stop-color="#B294FF" />
    </linearGradient>
    <linearGradient id="intelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E9EAB" />
      <stop offset="100%" stop-color="#EEF2F3" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="50%" stop-color="#1A1A1E" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>
  </defs>

  <style>
    .pulse {
      animation: pulse-glow 2s infinite ease-in-out;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.15); }
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  <rect width="100%" height="100%" fill="none" stroke="#2D2D34" stroke-width="1.5" rx="16" />

  <!-- Title / Header -->
  <text x="400" y="40" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="1">CHOOSE YOUR DOWNLOAD ARCHITECTURE</text>
  <text x="400" y="60" text-anchor="middle" fill="#8E8E93" font-size="12">Get the optimized version for your specific MacBook hardware</text>

  <!-- LEFT COLUMN: APPLE SILICON -->
  <g transform="translate(40, 80)">
    <!-- Card Background -->
    <rect width="340" height="135" rx="12" fill="#1C1C1E" stroke="url(#appleGrad)" stroke-width="1.5" />
    
    <!-- Apple Icon -->
    <path d="M 45,28 C 45,22.5 49.5,18 55,18 C 55.5,23.5 50.5,28 45,28 Z" fill="url(#appleGrad)" />
    <path d="M 54.5,29.5 C 50.5,29.5 47,32 45,32 C 43,32 40,29.5 36.5,29.5 C 31,29.5 26,34.5 26,42.5 C 26,55 37.5,65.5 45,65.5 C 51.5,65.5 60.5,56 61.5,47.5 C 55.5,46.5 54.5,39 54.5,29.5 Z" fill="url(#appleGrad)" />
    
    <text x="80" y="38" fill="#FFFFFF" font-size="16" font-weight="700">Apple Silicon</text>
    <text x="80" y="54" fill="#8E8E93" font-size="11">Newer Chip (M1 / M2 / M3 / M4 / M5)</text>
    
    <!-- Divider -->
    <line x1="20" y1="75" x2="320" y2="75" stroke="#2D2D34" stroke-width="1" />
    
    <!-- Filename info -->
    <text x="20" y="100" fill="#2F80ED" font-size="11" font-weight="600" letter-spacing="0.5">DOWNLOAD FILE:</text>
    <text x="20" y="117" fill="#FFFFFF" font-size="13" font-weight="600">StreamIPL-x.x.x-arm64.dmg</text>
    
    <!-- Pulsing Indicator -->
    <circle cx="310" cy="105" r="8" fill="#2F80ED" class="pulse" style="transform-origin: 310px 105px;" />
    <circle cx="310" cy="105" r="4" fill="#2F80ED" />
  </g>

  <!-- RIGHT COLUMN: INTEL MAC -->
  <g transform="translate(420, 80)">
    <!-- Card Background -->
    <rect width="340" height="135" rx="12" fill="#1C1C1E" stroke="url(#intelGrad)" stroke-width="1.5" />
    
    <!-- CPU / Intel Icon -->
    <rect x="25" y="22" width="32" height="32" rx="4" fill="none" stroke="url(#intelGrad)" stroke-width="2.5" />
    <rect x="31" y="28" width="20" height="20" rx="2" fill="url(#intelGrad)" opacity="0.9" />
    <!-- Microchip legs -->
    <line x1="41" y1="16" x2="41" y2="22" stroke="#8E9EAB" stroke-width="2" />
    <line x1="33" y1="16" x2="33" y2="22" stroke="#8E9EAB" stroke-width="2" />
    <line x1="49" y1="16" x2="49" y2="22" stroke="#8E9EAB" stroke-width="2" />
    <line x1="41" y1="54" x2="41" y2="60" stroke="#8E9EAB" stroke-width="2" />
    <line x1="33" y1="54" x2="33" y2="60" stroke="#8E9EAB" stroke-width="2" />
    <line x1="49" y1="54" x2="49" y2="60" stroke="#8E9EAB" stroke-width="2" />
    <line x1="19" y1="38" x2="25" y2="38" stroke="#8E9EAB" stroke-width="2" />
    <line x1="53" y1="38" x2="59" y2="38" stroke="#8E9EAB" stroke-width="2" />
    
    <text x="80" y="38" fill="#FFFFFF" font-size="16" font-weight="700">Intel Mac</text>
    <text x="80" y="54" fill="#8E8E93" font-size="11">Older MacBooks (Core i5 / i7 / i9)</text>
    
    <!-- Divider -->
    <line x1="20" y1="75" x2="320" y2="75" stroke="#2D2D34" stroke-width="1" />
    
    <!-- Filename info -->
    <text x="20" y="100" fill="#8E9EAB" font-size="11" font-weight="600" letter-spacing="0.5">DOWNLOAD FILE:</text>
    <text x="20" y="117" fill="#FFFFFF" font-size="13" font-weight="600">StreamIPL-x.x.x-x64.dmg</text>
    
    <!-- Pulsing Indicator -->
    <circle cx="310" cy="105" r="8" fill="#8E9EAB" class="pulse" style="transform-origin: 310px 105px;" />
    <circle cx="310" cy="105" r="4" fill="#8E9EAB" />
  </g>
</svg>
