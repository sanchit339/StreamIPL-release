<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="StreamIPL download architecture guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#161617"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect width="800" height="220" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="798.5" height="218.5" rx="13.25" fill="none" stroke="#3a3a3c" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="42" fill="#f5f5f7"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" letter-spacing="-0.022em">
    Choose your Mac architecture
  </text>
  <text x="40" y="63" fill="#8e8e93"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="13">
    Pick the build that matches your MacBook's processor.
  </text>

  <!-- Divider line under header -->
  <line x1="40" y1="78" x2="760" y2="78" stroke="#3a3a3c" stroke-width="1"/>

  <!-- ══════════════════════════════════════════
       LEFT CARD — Apple Silicon
  ══════════════════════════════════════════ -->
  <g transform="translate(40, 95)">
    <!-- Card -->
    <rect width="344" height="106" rx="10" fill="#28282d" stroke="#3a3a3c" stroke-width="1"/>

    <!-- Apple logo icon circle -->
    <circle cx="40" cy="44" r="22" fill="#1c1c1e"/>

    <!--
      Apple logo path from SVG viewBox 0 0 170 170.
      Centered at (40,44) in card coords.
      We translate to origin of apple shape bounding box center,
      scale down, then translate to (40,44).
      Apple logo spans roughly x:1–161, y:2–166 → center ≈ (81, 84)
      We want it ~24px tall → scale = 24/164 ≈ 0.146
      translate(-81*0.146, -84*0.146) + (40,44) = (-11.8,-12.3)+(40,44) = (28.2, 31.7)
    -->
    <g transform="translate(28.2, 31.7) scale(0.146)">
      <path d="
        M 150.37 130.25
        c -2.45 5.66 -5.35 10.87 -8.71 15.66
        c -4.58 6.53 -8.33 11.05 -11.22 13.56
        c -4.48 4.12 -9.28 6.23 -14.42 6.35
        c -3.69 0 -8.14 -1.05 -13.32 -3.18
        c -5.19 -2.12 -9.97 -3.17 -14.34 -3.17
        c -4.58 0 -9.49 1.05 -14.75 3.17
        c -5.26 2.13 -9.5 3.24 -12.74 3.35
        c -4.34 0.13 -9.13 -1.92 -14.37 -6.15
        c -2.82 -2.38 -6.59 -6.84 -11.31 -13.38
        c -5.35 -7.41 -9.87 -16.14 -13.57 -26.2
        C 0.54 102.64 -1.32 87.52 1.39 71.93
        c 2.72 -15.54 9.34 -27.88 19.86 -37
        c 10.51 -9.13 22.45 -13.75 35.81 -13.88
        c 7.02 0 14.37 2 22.04 6.02
        c 7.68 4.02 12.4 6.02 16.17 6.02
        c 3.17 0 7.78 -1.96 13.83 -5.9
        c 6.04 -3.92 12.83 -5.93 20.35 -6.02
        c 14.3 0.38 25.63 5.37 34 14.93
        c -13.53 8.16 -20.17 19.78 -19.92 34.82
        c 0.26 11.66 4.7 21.2 13.32 28.61
        c 8.62 7.4 18.73 11.32 30.34 11.75
        c -2.47 7.02 -5.7 13.36 -9.68 19.01 Z
        M 119.22 25.6
        c 0 -7.78 2.76 -14.88 8.27 -21.3
        c 6.69 -7.72 14.86 -11.75 24.16 -11.9
        c 1 9.04 -2.17 17.18 -8.1 23.35
        c -5.93 6.17 -13.9 9.94 -23.08 10.15
        c -0.36 -0.08 -0.66 -0.17 -0.9 -0.23
        c -0.23 -0.07 -0.35 -0.07 -0.35 -0.07 Z
      " fill="#f5f5f7"/>
    </g>

    <!-- Text block -->
    <text x="74" y="36"
          fill="#f5f5f7"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif"
          font-size="15" font-weight="600" letter-spacing="-0.01em">Apple Silicon</text>
    <text x="74" y="54"
          fill="#8e8e93"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
          font-size="12">M1 · M2 · M3 · M4 · M5</text>

    <!-- Pill label -->
    <rect x="20" y="76" width="200" height="20" rx="10" fill="#1c1c1e"/>
    <text x="30" y="90"
          fill="#636366"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
          font-size="10" font-weight="600" letter-spacing="0.07em">RECOMMENDED FOR MODERN MACS</text>
  </g>

  <!-- ══════════════════════════════════════════
       RIGHT CARD — Intel Mac
  ══════════════════════════════════════════ -->
  <g transform="translate(416, 95)">
    <!-- Card -->
    <rect width="344" height="106" rx="10" fill="#28282d" stroke="#3a3a3c" stroke-width="1"/>

    <!-- MacBook icon circle -->
    <circle cx="40" cy="44" r="22" fill="#1c1c1e"/>

    <!--
      MacBook silhouette, centered at (40, 44).
      Screen: 26 wide x 18 tall, base: 30 wide x 4 tall.
      Total height ≈ 24px. Center x=40, center y=44.
      Top of screen: y = 44 - 12 = 32. Left x: 40-13=27.
    -->

    <!-- Screen bezel -->
    <rect x="27" y="31" width="26" height="18" rx="2"
          fill="none" stroke="#8e8e93" stroke-width="1.8"/>
    <!-- Screen inner (dark display) -->
    <rect x="29.5" y="33.5" width="21" height="13" rx="1" fill="#3a3a3c"/>

    <!-- Hinge / base -->
    <path d="M24 49 L56 49 L53.5 53 L26.5 53 Z" fill="#8e8e93"/>

    <!-- Camera notch cutout -->
    <rect x="38.5" y="49" width="3" height="1.5" fill="#28282d"/>

    <!-- Text block -->
    <text x="74" y="36"
          fill="#f5f5f7"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif"
          font-size="15" font-weight="600" letter-spacing="-0.01em">Intel Mac</text>
    <text x="74" y="54"
          fill="#8e8e93"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
          font-size="12">Core i5 · i7 · i9</text>

    <!-- Pill label -->
    <rect x="20" y="76" width="186" height="20" rx="10" fill="#1c1c1e"/>
    <text x="30" y="90"
          fill="#636366"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
          font-size="10" font-weight="600" letter-spacing="0.07em">COMPATIBLE WITH OLDER MACS</text>
  </g>
</svg>
